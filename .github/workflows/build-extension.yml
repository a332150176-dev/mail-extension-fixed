name: Assemble fixed extension ZIP
on:
  push:
    branches: [main]
    paths:
      - "build-parts/**"
      - ".github/workflows/build-extension.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat build-parts/part*.b64 | base64 -d > mail-extension-fixed-v1.1.5.zip
          echo "aaf6649eedd0df9ede117793353722a845bce95c4b3427fa9890e3e5c2dcab4f  mail-extension-fixed-v1.1.5.zip" | sha256sum --check
          unzip -t mail-extension-fixed-v1.1.5.zip
          mkdir -p extension
          unzip -q mail-extension-fixed-v1.1.5.zip -d extension
          test "$(find extension -type f | wc -l)" -eq 12
      - name: Commit complete package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mail-extension-fixed-v1.1.5.zip extension/
          git commit -m "Add complete fixed extension package v1.1.5"
          git push
